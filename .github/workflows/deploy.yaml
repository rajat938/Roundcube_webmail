name: Deploy

on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main
   


jobs:
 Build:
  runs-on: ubuntu-latest

  steps:
   - uses:  actions/checkout@v6

   - uses: actions/setup-node@v3
     with:
       node-version: '20'

   - name: Set up Python 
     uses: actions/setup-python@v5
     with:
       python-version: "3.12"

   - name: Install dependencies
     run: |
      pip install --upgrade pip
      pip install "flask==3.1.3" "werkzeug==3.1.8" "waitress==3.0.2" \
        "PyMySQL==1.2.3" "imapclient==4.1.0" ruff

   - name: Syntax check
     run: python -m compileall -q sync account-manager monitor
   
   - name: Lint (sirf serious errors)
     run: ruff check --select E9,F63,F7,F82 sync account-manager monitor

   - name: Trivy Scan
     uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
     with:
      scan-type: fs
      scan-ref: .
      scanners: vuln,secret
      severity: CRITICAL,HIGH
      ignore-unfixed: true
      format: table
      exit-code: "1"


 Test_images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         
      matrix:
        image: [sync, account-manager, monitor]
    steps:
      - uses: actions/checkout@v5
 
      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:ci ./${{ matrix.image }}
 
      - name: Trivy scan (${{ matrix.image }} image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"