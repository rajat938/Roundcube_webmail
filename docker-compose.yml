services:
  roundcube:
    build:
     context: roundcube/
     dockerfile: Dockerfile
    container_name: roundcube
    restart: always
    ports:
      - "8081:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://dovecot
      - ROUNDCUBEMAIL_SMTP_SERVER=ssl://smtp.hostinger.com
      - ROUNDCUBEMAIL_SMTP_PORT=465
      - ROUNDCUBEMAIL_SMTP_USER=%u
      - ROUNDCUBEMAIL_SMTP_PASS=%p
      - ROUNDCUBEMAIL_DB_TYPE=mysql
      - ROUNDCUBEMAIL_DB_HOST=roundcubemail-mysql
      - ROUNDCUBEMAIL_DB_USER=roundcube
      - ROUNDCUBEMAIL_DB_PASSWORD=77bd0d92b43d73ac
      - ROUNDCUBEMAIL_DB_NAME=roundcubemail
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,newmail_notifier,ident_switch
      - ROUNDCUBEMAIL_COMPOSER_PLUGINS=gecka/ident-switch
    volumes:
      - ./www:/var/www/html
    depends_on:
      - roundcubemail-mysql
      - dovecot
      - redis

  roundcubemail-mysql:
    image: mariadb:11
    container_name: roundcube-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=kg5U0PJK81A5BOnD
      - MYSQL_DATABASE=roundcubemail
      - MYSQL_USER=roundcube
      - MYSQL_PASSWORD=77bd0d92b43d73ac
    volumes:
      - rc_db_data:/var/lib/mysql
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    security_opt:
      # Fixes io_uring permission error on modern Linux host kernels
      - seccomp=unconfined

  redis:
    image: redis:7-alpine
    container_name: roundcube-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  dovecot:
    build:
      context: ./dovecot
      dockerfile: Dockerfile
    container_name: local-dovecot
    restart: always
    volumes:
      - ./mail-mirror/maildir:/var/mail
      - dovecot_indexes:/var/mail-indexes
    depends_on:
      - roundcubemail-mysql


  # Hostinger -> local mirror (new mail within ~1s via IDLE, flag changes,
  # new folders). Replaces the old imapsync-based sync-daemon.
  sync-pull:
    build: ./sync
    container_name: mail-sync-pull
    command: ["python3", "/app/pull.py"]
    restart: always
    env_file: .env
    environment:
      - DB_HOST=roundcubemail-mysql
      - LOCAL_IMAP_HOST=dovecot
    depends_on:
      - roundcubemail-mysql
      - dovecot

  # local mirror -> Hostinger (read/unread/flags + sent mail only; can never
  # delete or move anything on Hostinger). Idle unless something changed.
  sync-push:
    build: ./sync
    container_name: mail-sync-push
    command: ["python3", "/app/push.py"]
    restart: always
    env_file: .env
    environment:
      - DB_HOST=roundcubemail-mysql
      - LOCAL_IMAP_HOST=dovecot
    depends_on:
      - roundcubemail-mysql
      - dovecot

  # Admin page for adding/pausing accounts. Web login + HTTPS via caddy.
  # Not published on any host port -- only caddy can reach it.
  account-manager:
    build: ./account-manager
    container_name: account-manager
    restart: always
    env_file: .env
    environment:
      - DB_HOST=roundcubemail-mysql
    depends_on:
      - roundcubemail-mysql

  # HTTPS front door for the account manager: https://<server>:8443
  # (see caddy/Caddyfile.domain to use a real domain + Let's Encrypt)
  caddy:
    image: caddy:2.10
    container_name: admin-https
    restart: always
    ports:
      - "8443:8443"
    environment:
      - ADMIN_SITE=${ADMIN_SITE:-:8443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - account-manager

  monitor:
    build: ./monitor
    container_name: email-monitor
    restart: always
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      - roundcubemail-mysql

volumes:
  rc_db_data:
  dovecot_indexes:
  caddy_data:
  caddy_config:

